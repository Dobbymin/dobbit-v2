name: News Ingest (daily)

on:
  schedule:
    # 매일 10:07 KST (UTC 01:07) — GitHub Actions 정각 부하로 인한 schedule drop 완화
    - cron: '7 1 * * *'
    # 매일 10:37 KST (UTC 01:37) — GitHub schedule drop 대비 백업 실행
    - cron: '37 1 * * *'
  workflow_dispatch:
    inputs:
      requestedBy:
        description: 'SCHEDULE or MANUAL'
        required: false
        default: 'MANUAL'

concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: [self-hosted, dobbit-pi]
    timeout-minutes: 75
    steps:
      - name: Trigger news ingestion
        run: |
          REQUESTED_BY="${{ github.event.inputs.requestedBy || 'SCHEDULE' }}"

          echo "Starting news ingestion (requestedBy: $REQUESTED_BY)..."

          http_code=$(curl -sS -o /tmp/news_ingest_resp.json -w "%{http_code}" \
            --max-time 3600 \
            -X POST "http://127.0.0.1:3003/api/news/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_CRON_TOKEN }}" \
            -d "{\"requestedBy\":\"$REQUESTED_BY\"}")

          echo "HTTP Status: $http_code"
          echo "Response:"
          cat /tmp/news_ingest_resp.json || true
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::News ingest failed with HTTP $http_code"
            exit 1
          fi

          echo "News ingestion completed successfully"

      - name: Trigger prediction review
        run: |
          echo "Starting prediction review..."

          http_code=$(curl -sS -o /tmp/news_review_resp.json -w "%{http_code}" \
            --max-time 3600 \
            -X POST "http://127.0.0.1:3003/api/news/predictions/review" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_CRON_TOKEN }}")

          echo "HTTP Status: $http_code"
          echo "Response:"
          cat /tmp/news_review_resp.json || true
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Prediction review failed with HTTP $http_code"
            exit 1
          fi

          echo "Prediction review completed successfully"
