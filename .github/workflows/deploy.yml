name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, dobbit-pi]
    defaults:
      run:
        working-directory: /home/dobbymin/project/dobbit-v2
    steps:
      - name: Sync repository
        run: |
          git fetch --prune origin
          git reset --hard origin/main

      - name: Build & deploy (docker compose)
        run: |
          docker compose -p dobbit-v2 -f docker/docker-compose.deploy.yml up -d --build

      - name: Install/update systemd --user timer for news ingest
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          mkdir -p ~/.config/systemd/user
          cp ops/news-ingest/dobbit-news-ingest.service ops/news-ingest/dobbit-news-ingest.timer ~/.config/systemd/user/
          systemctl --user daemon-reload
          systemctl --user enable --now dobbit-news-ingest.timer
          systemctl --user list-timers dobbit-news-ingest.timer --no-pager || true
          echo "dobbit-news-ingest.timer (user) installed and started"

      - name: Verify deployment
        run: |
          docker compose -p dobbit-v2 -f docker/docker-compose.deploy.yml ps
          check_health() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$name responding ($url)"
                return 0
              fi

              echo "$name not ready yet ($attempt/30); retrying in 2s"
              sleep 2
            done

            echo "ERROR: $name did not become healthy after 30 attempts ($url)" >&2
            docker compose -p dobbit-v2 -f docker/docker-compose.deploy.yml logs --tail=50
            exit 1
          }

          check_health "web container" "http://127.0.0.1:3002"
          check_health "api container" "http://127.0.0.1:3003/api/news/articles?limit=1"
