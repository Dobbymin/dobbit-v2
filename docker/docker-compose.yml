version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dobbit_postgres
    environment:
      POSTGRES_USER: dobbit
      POSTGRES_PASSWORD: dobbit
      POSTGRES_DB: dobbit_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dobbit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dobbit_network

  redis:
    image: redis:7-alpine
    container_name: dobbit_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dobbit_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  dobbit_network:
    driver: bridge
